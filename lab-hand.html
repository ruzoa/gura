<style>
:root{--bg:#10170f;--panel:#1a241a;--line:#2d3b2c;--fg:#e8efe4;--dim:#93a38f;--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 12px calc(24px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nav a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:13px}
.nav a.on{color:#1a1405;background:var(--acc);border-color:var(--acc);font-weight:700}
#viewWrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 8px}
#view{position:relative;width:100%;aspect-ratio:1/1;max-height:62vh;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#e6d0a6;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:8px;bottom:6px;font-size:12px;color:#5b4129;background:rgba(255,250,240,.75);border-radius:8px;padding:2px 8px;pointer-events:none}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
h2{font-size:13px;color:var(--dim);margin:0 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row>label{flex:0 0 92px;color:var(--dim);font-size:13px}
.row>output{flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{flex:1;min-width:0;height:32px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#0f180f;color:var(--fg);border-radius:18px;padding:7px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border:0;border-radius:10px;padding:12px 8px;font:inherit;font-weight:700;cursor:pointer;background:#2b3a2a;color:var(--fg)}
.btn.main{flex:2;background:var(--acc);color:#1a1405;font-size:16px}
#line{width:100%;margin-top:8px;background:#0b110b;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:none}

  <div class="btns"><button class="btn" id="reset" type="button">처음 값으로</button><button class="btn" id="copy" type="button">값 복사</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* 테스트룸 · 알까기 손: 게임에 넣기 전에 3D 손 모양을 보는 곳 (메인에 링크 없음).
   손은 코드로 만든 만화풍 손: 손등(납작한 공) + 손가락(곡선을 따라 만든 둥근 관) + 툰 셰이딩 + 검은 외곽선.
   엄지·중지 고리(당길수록 원 → 납작한 타원), 검지·약지·소지(당길수록 펴지고 벌어짐), 튕기면 중지가 앞으로 쭉.
   반투명은 '깊이만 먼저 그리고 → 색을 한 번만' 그려서 손가락이 겹친 곳도 고르게 비침.
   그림처럼 보이게 (2026-10-23): 손은 따로 '불투명하게' 그린 뒤(손 그림 한 장) 그 그림을 통째로 반투명하게 얹음.
   윤곽선은 그 그림의 깊이 차이로 그림(바깥 윤곽 + 앞 손가락이 뒤를 가리는 곳만, 마디 이음새는 안 그림) → 선이 가늘고 또렷하고 겹친 곳 얼룩 없음.
   색은 플레이어 색을 밝게 한 면 + 한쪽 가장자리를 따라 진하고 따뜻한 그늘. 손톱 없음.
   값은 gura-lab-hand3에 저장 */
const KEY='gura-lab-hand3';
const DEF={p:.5,fl:0,open:0,pitch:22,tilt:60,size:1.3,squash:.45,fat:1,spread:17,col:0,view:'top',alpha:1,jitter:1,ink:1};
let S={...DEF};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};$('#line').value=JSON.stringify({pitch:S.pitch,tilt:S.tilt,size:S.size,squash:S.squash,fat:S.fat,spread:S.spread})};
const $=q=>document.querySelector(q);
const COLS=[['빨강',0xe0553f],['파랑',0x3f7fe0],['노랑',0xf2c230],['초록',0x47b35a]];
const SR=.15,SH=.066,TOP=0;   // 알 반지름·반두께, 판 윗면 높이 (게임과 같은 값)

/* ----- 장면 ----- */
const view=$('#view'),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));view.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xe6d0a6);
scene.add(new THREE.HemisphereLight(0xfff6e6,0x8a6a4a,.75));
const sun=new THREE.DirectionalLight(0xffffff,.55);sun.position.set(-2,5,3);scene.add(sun);
const cam=new THREE.PerspectiveCamera(36,1,.05,50);
const grad=(()=>{const d=new Uint8Array([90,160,255]);const t=new THREE.DataTexture(d,3,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t})();
const toon=c=>new THREE.MeshToonMaterial({color:c,gradientMap:grad});
const INK=0x3b2a1f;
// 판 한 칸과 알 (게임처럼 13줄 판의 일부)
{const cv=document.createElement('canvas');cv.width=cv.height=512;const g=cv.getContext('2d');g.fillStyle='#e0b878';g.fillRect(0,0,512,512);
 for(let i=0;i<40;i++){g.strokeStyle='rgba(138,85,32,.12)';g.lineWidth=1+Math.random()*2;g.beginPath();const y=Math.random()*512;g.moveTo(0,y);g.bezierCurveTo(170,y+8,340,y-8,512,y+3);g.stroke()}
 g.strokeStyle='rgba(60,36,12,.85)';g.lineWidth=2;for(let k=0;k<=6;k++){const v=k/6*512;g.beginPath();g.moveTo(0,v);g.lineTo(512,v);g.moveTo(v,0);g.lineTo(v,512);g.stroke()}
 const tex=new THREE.CanvasTexture(cv);const b=new THREE.Mesh(new THREE.PlaneGeometry(2,2),toon(0xffffff));b.material.map=tex;b.rotation.x=-Math.PI/2;scene.add(b)}
const stone=new THREE.Group();{const m=new THREE.Mesh(new THREE.SphereGeometry(SR,32,18),toon(0x26262a));m.scale.y=SH/SR;stone.add(m);const o=new THREE.Mesh(new THREE.SphereGeometry(SR,32,18),new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide}));o.scale.set(1.07,SH/SR*1.12,1.07);stone.add(o)}
stone.position.y=SH;scene.add(stone);stone.traverse(o=>o.layers.enable(2));

/* ----- 손 만들기 -----
   손등이 위(+Y)를 보고 손가락이 앞(+X, 튕기는 쪽)으로 뻗은 오른손. +Z가 엄지 쪽.
   손등: 손 모양 윤곽을 납작하게 돌출(모서리 둥글게). 손가락: 마디 3개(끝으로 갈수록 가늘어짐), 서로 붙어 있음.
   중지는 말려서 엄지 끝에 걸리고(엄지는 늘 중지 끝을 받치도록 자동으로 맞춤), 튕기면 중지만 앞으로 쭉.
   손 전체를 X축(튕기는 방향)으로 굴려(tilt) 위에서 엄지·중지 고리가 보이게. 손목은 짧고 끝이 흐려짐 */
const HAND=new THREE.Group();scene.add(HAND);
const inner=new THREE.Group();HAND.add(inner);
const wristG=new THREE.Group();HAND.add(wristG);   // 손목·팔뚝은 손을 세워도 판과 나란히
const mats={skin:null,wrist:null};
const SKIN_VS=`varying vec3 vN;varying vec3 vV;varying vec2 vUv;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`;
const SKIN_FS=`uniform vec3 uBase;uniform vec3 uShade;uniform float uWrist;varying vec3 vN;varying vec3 vV;varying vec2 vUv;
void main(){vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;vec3 L=normalize(vec3(-.45,.75,.55));float ndl=dot(n,L),ndv=dot(n,normalize(vV));
 float s=max(1.-smoothstep(-.36,-.3,ndl),(1.-smoothstep(.2,.25,ndv))*(1.-smoothstep(.35,.45,ndl)));   // 빛 반대쪽 + 아래쪽 가장자리를 따라 그늘 한 단
 float a=uWrist>.5?clamp((1.-vUv.y)/.75,0.,1.):1.;gl_FragColor=vec4(mix(uBase,uShade,s),a);}`;
function skinMat(wrist){const c=new THREE.Color(COLS[S.col][1]),hsl={};c.getHSL(hsl);
  const base=new THREE.Color().setHSL(hsl.h,Math.min(1,hsl.s*.85),Math.min(.82,hsl.l+.17));   // 밝은 면: 플레이어 색을 밝게
  const shade=new THREE.Color().setHSL((hsl.h+.985)%1,Math.min(1,hsl.s*1.05),hsl.l+.02);   // 그늘: 진하고 살짝 붉게 (그림의 분홍 그늘처럼)
  return new THREE.ShaderMaterial({uniforms:{uBase:{value:base},uShade:{value:shade},uWrist:{value:wrist?1:0}},vertexShader:SKIN_VS,fragmentShader:SKIN_FS})}
function mkMats(){mats.skin=skinMat(0);mats.wrist=skinMat(1)}
/* 마디 하나: +X로 길이 L, 굵기 r0 → r1 (양 끝 둥글게) */
function capGeo(L,r0,r1){
  const pts=[],n=8;
  for(let k=0;k<=n;k++){const a=-Math.PI/2+k/n*Math.PI/2;pts.push(new THREE.Vector2(Math.cos(a)*r0,Math.sin(a)*r0))}
  for(let k=0;k<=n;k++){const a=k/n*Math.PI/2;pts.push(new THREE.Vector2(Math.cos(a)*r1,L+Math.sin(a)*r1))}
  const g=new THREE.LatheGeometry(pts,28);g.rotateZ(-Math.PI/2);return g;   // 세로(Y) → 앞(X)
}
const all=[];
function addPart(parent,geo,kind){const m=new THREE.Mesh(geo,kind==='wrist'?mats.wrist:mats.skin);m.layers.set(1);parent.add(m);all.push({m,kind});return m}
/* 손가락: 뿌리(관절 묶음) → 마디 3개. 각 관절은 Z축으로 아래(손바닥 쪽)로 굽음 */
function finger(base,lens,r0,r1,nail){
  const F=S.fat,root=new THREE.Group();root.position.set(...base);inner.add(root);
  const joints=[];let par=root;const rs=[r0,r0+(r1-r0)*.45,r0+(r1-r0)*.75,r1].map(v=>v*F);
  lens.forEach((L,k)=>{const j=new THREE.Group();if(k)j.position.x=lens[k-1];par.add(j);joints.push(j);
    addPart(j,capGeo(L,rs[k],rs[k+1]),'skin');par=j});
  const tip=new THREE.Object3D();tip.position.x=lens[lens.length-1]+rs[3]*.6;par.add(tip);
  return {root,joints,tip,lens};
}
let HS=null;   // 손 뼈대
const HZ=-1;   // 엄지 쪽 (-Z): 오른손 (손등이 위, 손가락이 앞으로 뻗었을 때 엄지가 왼쪽)
function buildHand(){
  inner.clear();wristG.clear();all.length=0;mkMats();
  const F=S.fat;
  // 손등: 손 모양 윤곽 (x 앞, y 옆: 엄지 쪽이 +, 마지막에 HZ로 오른손 방향). 손바닥 길이 ≈ 중지 길이
  const sh=new THREE.Shape(),Y=v=>v*HZ*-1;   // 모양 y → 월드 -z 방향을 맞춤 (rotateX 뒤 z=y)
  sh.moveTo(-.235,Y(-.085));sh.quadraticCurveTo(-.12,Y(-.11),-.02,Y(-.098));sh.quadraticCurveTo(.012,Y(-.04),.008,Y(.03));sh.quadraticCurveTo(.0,Y(.088),-.03,Y(.098));
  sh.quadraticCurveTo(-.09,Y(.11),-.15,Y(.112));sh.quadraticCurveTo(-.215,Y(.1),-.235,Y(.075));sh.closePath();
  const ex=(b)=>{const g=new THREE.ExtrudeGeometry(sh,{depth:.026,bevelEnabled:true,bevelThickness:.02+b,bevelSize:.02+b,bevelSegments:5,curveSegments:20});g.rotateX(-Math.PI/2);g.translate(0,-.013,0);return g};
  addPart(inner,ex(0),'skin');
  // 엄지 뿌리 살(손바닥 쪽 도톰한 곳): 손등 엄지 쪽 아래
  {const tg=b=>{const g=new THREE.SphereGeometry(1,22,14);g.scale(.075+b,.032+b,.042+b);g.rotateY(HZ*-.35);g.translate(-.14,-.028,HZ*.075);return g};
   addPart(inner,tg(0),'skin')}
  // 손목: 짧게, 끝은 흐리게
  {const wg=b=>{const g=new THREE.CylinderGeometry(.072+b,.08+b,.22,24,1,true);g.rotateZ(Math.PI/2);g.scale(1,.66,1);g.translate(-.085,0,0);return g};
   addPart(wristG,wg(0),'wrist')}
  // 손가락: 뿌리는 손등 앞 가장자리에 붙여서 (검지가 엄지 쪽)
  const fs={
    index:finger([.0,.008,HZ*.068],[.09,.055,.045],.03,.024,true),
    middle:finger([.008,.008,HZ*.022],[.1,.062,.05],.031,.025,true),
    ring:finger([.002,.006,HZ*-.024],[.093,.058,.047],.029,.023,true),
    pinky:finger([-.018,.003,HZ*-.066],[.07,.045,.04],.025,.02,true)};
  // 엄지: 두 마디. 길이는 매 프레임 중지 끝까지 거리에 맞춰 늘고 줄어 거의 곧게 받침 (꺾이지 않게)
  const t1=new THREE.Group(),t2=new THREE.Group();inner.add(t1,t2);
  const r=[.033,.03,.025].map(v=>v*F),TL=[.07,.06];
  const s1=new THREE.Group(),s2=new THREE.Group();t1.add(s1);t2.add(s2);
  addPart(s1,capGeo(TL[0],r[0],r[1]),'skin');
  addPart(s2,capGeo(TL[1],r[1],r[2]),'skin');
  HS={fs,thumb:{base:new THREE.Vector3(-.105,-.032,HZ*.088),t1,t2,s1,s2,TL,r2:r[2]},tgt:null};
}
const D2R=Math.PI/180,lerp=(a,b,t)=>a+(b-a)*t,lerpA=(a,b,t)=>a.map((v,k)=>lerp(v,b[k],t));
/* 자세: p 당긴 힘(0 느슨 → 1 뻣뻣·꽉), fl 튕김(0 → 1 중지가 쭉) */
function poseHand(p,fl){
  const set=(f,ang,yaw,lift)=>{f.root.rotation.set(0,(yaw||0)*D2R,(lift||0)*D2R);f.joints.forEach((j,k)=>{j.rotation.z=-ang[k]*D2R})};
  const {fs}=HS,sq=S.squash;
  const o=S.open||0,O=(a,b)=>lerpA(a,b,o),o1=(a,b)=>lerp(a,b,o);   // 손 펴기: 손가락은 살짝만 굽은 채 부채꼴로, 엄지는 옆으로 떨어져 뻗음
  set(fs.index,O(lerpA([28,34,20],[2,4,3],p),[6,8,6]),o1(lerp(1,8,p),14),o1(lerp(-4,14,p),0));
  set(fs.ring,O(lerpA([40,48,34],[6,8,5],p),[8,10,8]),o1(lerp(-1,-7,p),-9),o1(lerp(-4,14,p),0));
  set(fs.pinky,O(lerpA([46,54,40],[8,10,6],p),[10,12,10]),o1(lerp(-3,-14,p),-21),o1(lerp(-4,14,p),0));   // 검지·약지·소지: 당길수록 곧게 펴져 위로 들리고 벌어짐
  // 중지: 말려서 엄지에 걸림. 당길수록 더 꽉, 튕기면 쭉
  const pc=S.pitch,straight=[pc*.6+18,pc*.3+10,pc*.1+6];
  const mid=lerpA(lerpA([62,78,46],[62+40*sq,78+30*sq,46+30*sq],p),straight,fl);
  set(fs.middle,O(mid,[6,8,6]),0,0);
  // 엄지: 중지 손톱 바로 앞을 받침. 두 마디 길이를 거리에 맞춰 조금 굽은 채로 (손가락처럼 살짝만 굽음)
  inner.updateMatrixWorld(true);
  const tip=inner.worldToLocal(fs.middle.tip.getWorldPosition(new THREE.Vector3()));
  if(fl<=0)HS.tgt=tip.clone().add(new THREE.Vector3(.016,-.022,0));
  if(!HS.tgt)HS.tgt=tip.clone();
  const B0=HS.thumb.base,openT=B0.clone().add(new THREE.Vector3(.62,-.12,HZ*.78).normalize().multiplyScalar(.135));   // 편 엄지 끝: 손등 옆 앞으로
  const Th=HS.thumb,T=o>0?HS.tgt.clone().lerp(openT,o):HS.tgt,B=Th.base,v=T.clone().sub(B),d=Math.max(.06,v.length()),u=v.clone().normalize();
  const k=d/(.94*(Th.TL[0]+Th.TL[1])),L1=Th.TL[0]*k,L2=Th.TL[1]*k;   // 거리에 맞춘 길이 (곧게 펴면 거리의 1/0.94)
  const a=(L1*L1-L2*L2+d*d)/(2*d),h=Math.sqrt(Math.max(0,L1*L1-a*a));
  const hint=new THREE.Vector3(0,-.4,HZ).normalize(),w=hint.sub(u.clone().multiplyScalar(hint.dot(u))).normalize();   // 마디는 손바닥 바깥·아래로 살짝
  const E=B.clone().add(u.clone().multiplyScalar(a)).add(w.multiplyScalar(h));
  const aim=(g,from,to)=>{g.position.copy(from);g.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),to.clone().sub(from).normalize())};
  aim(Th.t1,B,E);aim(Th.t2,E,T);Th.s1.scale.x=k;Th.s2.scale.x=k;
}
/* ----- 손 그림 한 장: 손만 따로 그리고(알은 깊이만 넣어 가림), 깊이 차이로 윤곽선 → 통째로 반투명하게 얹기 ----- */
const HP={rt:null,ss:1,depthOnly:new THREE.MeshBasicMaterial({colorWrite:false})};
const COMP_FS=`uniform sampler2D tC;uniform sampler2D tD;uniform vec2 px;uniform float near;uniform float far;uniform float lw;uniform float op;uniform float lop;uniform float ink;uniform vec3 inkC;varying vec2 vUv;
float lin(float d){float z=d*2.-1.;return 2.*near*far/(far+near-z*(far-near));}
void main(){vec4 c=texture2D(tC,vUv);float dp=lin(texture2D(tD,vUv).x),line=0.;
 if(ink>.5){for(int i=0;i<16;i++){float a=float(i)*.3927;for(int k=1;k<=2;k++){vec2 o=vec2(cos(a),sin(a))*px*lw*float(k)*.5;vec2 q=vUv+o;
   float aq=texture2D(tC,q).a;if(aq<.02)continue;float dq=lin(texture2D(tD,q).x);
   float thr=.014*dq;   // 앞 손가락이 뒤를 가리는 곳·바깥 윤곽만 (마디 이음새처럼 이어진 면은 깊이 차이가 작아 안 그림)
   if(dp-dq>thr)line=max(line,aq);}}}
 vec4 o=vec4(c.rgb,c.a*op);if(line>0.){o=mix(o,vec4(inkC,lop),line);}
 if(o.a<.003)discard;gl_FragColor=o;}`;
const comp=new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.ShaderMaterial({transparent:true,depthTest:false,depthWrite:false,
  uniforms:{tC:{value:null},tD:{value:null},px:{value:new THREE.Vector2()},near:{value:cam.near},far:{value:cam.far},lw:{value:2.4},op:{value:1},lop:{value:1},ink:{value:1},inkC:{value:new THREE.Color(INK)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,fragmentShader:COMP_FS}));
comp.frustumCulled=false;const compScene=new THREE.Scene();compScene.add(comp);const compCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
function renderAll(op,lop){
  const W2=R.domElement.width,H2=R.domElement.height,ss=R.getPixelRatio()>=2?1:2,w=W2*ss,h=H2*ss;
  if(!HP.rt||HP.rt.width!==w||HP.rt.height!==h){if(HP.rt)HP.rt.dispose();HP.rt=new THREE.WebGLRenderTarget(w,h,{depthBuffer:true});HP.rt.depthTexture=new THREE.DepthTexture(w,h);HP.rt.depthTexture.type=THREE.UnsignedIntType;HP.ss=ss}
  cam.layers.set(0);R.setRenderTarget(null);R.render(scene,cam);   // 판·알
  if(!HAND.visible)return;
  const bg=scene.background;scene.background=null;R.setRenderTarget(HP.rt);R.setClearColor(0x000000,0);R.clear(true,true,true);
  R.autoClear=false;cam.layers.set(2);scene.overrideMaterial=HP.depthOnly;R.render(scene,cam);   // 알은 깊이만 (손이 알 뒤로 가면 가려지게)
  scene.overrideMaterial=null;cam.layers.set(1);R.render(scene,cam);   // 손 (불투명)
  R.autoClear=true;scene.background=bg;R.setRenderTarget(null);
  const u=comp.material.uniforms;u.tC.value=HP.rt.texture;u.tD.value=HP.rt.depthTexture;u.px.value.set(1/w,1/h);u.lw.value=2.2*R.getPixelRatio()*HP.ss;
  u.op.value=op;u.lop.value=lop;u.ink.value=S.ink?1:0;
  R.autoClear=false;R.render(compScene,compCam);R.autoClear=true;
}

/* ----- 떨림 (게임과 같은 식) ----- */
function jit(t){const a=.5*Math.sin(t*.0067+1.3)+.3*Math.sin(t*.0151+.4)+.2*Math.sin(t*.0389+2.1);const b=Math.pow(Math.sin(t*.0021),8)*Math.sin(t*.047);return Math.max(-1,Math.min(1,a*.8+b*.6))}

/* ----- 카메라 (끌어서 돌리기·확대) ----- */
const CV={top:{th:-Math.PI/2,ph:1.5707,d:2.2},side:{th:-Math.PI/2+.9,ph:.35,d:1.5},near:{th:-Math.PI/2+.5,ph:.8,d:.95}};
let orb={...CV[S.view]||CV.top},tgt=new THREE.Vector3(-.4,.1,0);
function placeCam(){const ph=Math.min(1.5707,Math.max(.05,orb.ph));cam.position.set(tgt.x+orb.d*Math.cos(ph)*Math.cos(orb.th),tgt.y+orb.d*Math.sin(ph),tgt.z-orb.d*Math.cos(ph)*Math.sin(orb.th));
  if(ph>1.56){cam.up.set(0,0,-1)}else cam.up.set(0,1,0);cam.lookAt(tgt)}
{let pts=new Map(),last=null,pinch=0;
 view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);last=[e.clientX,e.clientY];if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
 view.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
   if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)orb.d=Math.max(.4,Math.min(4,orb.d*pinch/d));pinch=d;return}
   const dx=e.clientX-last[0],dy=e.clientY-last[1];last=[e.clientX,e.clientY];orb.th-=dx*.008;orb.ph+=dy*.008;setView('')});
 const up=e=>{pts.delete(e.pointerId);pinch=0;if(pts.size===1)last=[...pts.values()][0]};view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
 view.addEventListener('wheel',e=>{e.preventDefault();orb.d=Math.max(.4,Math.min(4,orb.d*(1+Math.sign(e.deltaY)*.1)))},{passive:false})}
function setView(v){S.view=v;document.querySelectorAll('#views .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v&&CV[v])orb={...CV[v]};save()}

/* ----- 조작판 ----- */
const sl=['p','fl','open','pitch','tilt','size','squash','fat','spread'];
const fmt={pitch:v=>v+'°',p:v=>Math.round(v*100)+'%',fl:v=>Math.round(v*100)+'%',open:v=>Math.round(v*100)+'%',tilt:v=>v+'°',size:v=>(+v).toFixed(2),squash:v=>(+v).toFixed(2),fat:v=>(+v).toFixed(2),spread:v=>v+'°'};
let dirty=true;
for(const k of sl){const el=$('#'+k);el.value=S[k];$('#'+k+'O').textContent=fmt[k](S[k]);el.addEventListener('input',()=>{S[k]=+el.value;$('#'+k+'O').textContent=fmt[k](S[k]);anim=null;dirty=true;save()})}
$('#cols').innerHTML=COLS.map(([n],i)=>`<button class="chip${i===S.col?' on':''}" data-c="${i}" type="button">${n}</button>`).join('');
$('#cols').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;S.col=+b.dataset.c;document.querySelectorAll('#cols .chip').forEach(x=>x.classList.toggle('on',x===b));mkMats();dirty=true;save()});
$('#views').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setView(b.dataset.v)});
const tog=(id,k)=>{const b=$('#'+id);b.classList.toggle('on',!!S[k]);b.addEventListener('click',()=>{S[k]=S[k]?0:1;b.classList.toggle('on',!!S[k]);dirty=true;save()})};
tog('alpha','alpha');tog('jitter','jitter');tog('ink','ink');
$('#reset').addEventListener('click',()=>{const keep={col:S.col,view:S.view};S={...DEF,...keep};for(const k of sl){$('#'+k).value=S[k];$('#'+k+'O').textContent=fmt[k](S[k])}['alpha','jitter','ink'].forEach(k=>$('#'+k).classList.toggle('on',!!S[k]));dirty=true;save()});
$('#copy').addEventListener('click',()=>{const t=$('#line').value;try{navigator.clipboard.writeText(t);$('#copy').textContent='복사했습니다';setTimeout(()=>$('#copy').textContent='값 복사',1400)}catch(e){}});
/* 튕기기 재생: 0 → 당긴 힘까지 천천히 당김(1.2초) → 0.4초 버팀 → 중지로 탁(0.09초) → 알이 미끄러져 나가고 손은 사라짐 → 처음으로 */
let anim=null,loop=false;
$('#play').addEventListener('click',()=>{anim={t0:performance.now()}});
$('#loop').addEventListener('click',()=>{loop=!loop;$('#loop').classList.toggle('main',loop);if(loop&&!anim)anim={t0:performance.now()}});
const AN={pull:1200,hold:400,flick:90,fly:900,rest:500};

/* ----- 그리기 ----- */
mkMats();setView(S.view||'top');save();
let built='';
function frame(now){
  const w=view.clientWidth,h=view.clientHeight;if(R.domElement.width!==Math.round(w*R.getPixelRatio())||R.domElement.height!==Math.round(h*R.getPixelRatio())){R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  let p=S.p,fl=S.fl,fade=1,sx=0;
  if(anim){const e=now-anim.t0,A=AN;
    if(e<A.pull)p=S.p*(1-Math.pow(1-e/A.pull,2)),fl=0;
    else if(e<A.pull+A.hold){p=S.p;fl=0}
    else if(e<A.pull+A.hold+A.flick){p=S.p;fl=(e-A.pull-A.hold)/A.flick}
    else if(e<A.pull+A.hold+A.flick+A.fly){const k=(e-A.pull-A.hold-A.flick)/A.fly;p=S.p;fl=1;fade=Math.max(0,1-k*2.4);sx=(1-Math.pow(1-k,3))*(.4+1.4*S.p)}
    else if(e<A.pull+A.hold+A.flick+A.fly+A.rest){fade=0;sx=.4+1.4*S.p}
    else{anim=loop?{t0:now}:null}
  }
  stone.position.x=sx;
  const key=[S.fat,S.ink,S.col].join(',');
  if(key!==built||dirty){buildHand();built=key;dirty=false}
  poseHand(p,fl);
  const op0=S.alpha?.2+.7*p:1,op=op0*fade;HAND.visible=fade>.01;
  // 굴리기(tilt)·크기·떨림: 중지 끝(알에 닿는 곳)이 알 뒤에 오게
  const sc=S.size,tl=S.tilt*Math.PI/180,jt=S.jitter?(S.spread*Math.PI/180)*p*p*jit(now):0;
  inner.rotation.set(0,0,S.pitch*Math.PI/180);inner.position.set(0,0,0);
  poseHand(p,1);inner.updateMatrix();   // 튕긴 자세의 중지 끝을 알 뒤 자리에 맞춤
  const tipH=inner.worldToLocal(HS.fs.middle.tip.getWorldPosition(new THREE.Vector3())).applyMatrix4(inner.matrix);
  inner.position.set(-tipH.x,-tipH.y,-tipH.z);poseHand(p,fl);
  HAND.rotation.order='YXZ';HAND.rotation.set(-tl,-jt,0);HAND.updateMatrixWorld(true);
  HAND.scale.setScalar(sc);
  // 손목은 손바닥 뒤끝(손목뼈)에서 뒤로 판과 나란히
  inner.updateMatrix();const heel=new THREE.Vector3(-.27,-.01,.01).applyMatrix4(inner.matrix);wristG.position.copy(heel);wristG.rotation.z=-.32;   // 팔뚝은 뒤로 갈수록 살짝 올라감 (팔꿈치가 들린 자세)
  HAND.position.set(-SR-.008,SH,0);   // 튕긴 중지 끝 = 알 뒤 가운데 높이
  // 손목·손끝이 판 아래로 들어가지 않게 들어 올림
  HAND.updateMatrixWorld(true);let lo=1e9;const v3=new THREE.Vector3();
  for(const z of [-.06,0,.06])lo=Math.min(lo,wristG.localToWorld(v3.set(0,-.035,z)).y);   // 손목 아래(손바닥 두께 안쪽)가 판에 닿을락 말락
  // 손목이 판 아래로 들어가면 들어 올리지 않고 중지 끝(알에 닿는 곳)을 축으로 손 뒤쪽을 들어 올림 → 중지 끝은 그대로 알 뒤
  if(lo<0){const hx=Math.max(.2,Math.hypot(wristG.getWorldPosition(v3).x-HAND.position.x,0));HAND.rotation.z=-Math.asin(Math.min(.9,(-lo+.004)/hx))}
  HS.dbg={lo};
  placeCam();renderAll(op,Math.max(.85,op0)*fade);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
