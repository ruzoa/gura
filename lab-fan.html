<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>테스트룸 · 카드 든 인형</title>
<style>
:root{--bg:#10170f;--panel:#1a241a;--line:#2d3b2c;--fg:#e8efe4;--dim:#93a38f;--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
main{max-width:1180px;margin:0 auto;padding:10px 12px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:15px;margin:2px 0 8px;color:var(--dim);font-weight:600}
.nav{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nav a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:5px 12px;font-size:13px}
.nav a.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.wrap{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
/* 미리보기: 고른 화면 크기 그대로의 게임(index.html)을 줄여서 보여 줌 */
#viewBox{flex:1 1 360px;min-width:0;display:flex;justify-content:center}
#view{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#000}
#view iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0}
#side{flex:0 1 340px;min-width:0;width:100%}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}
.row>label{flex:0 0 64px;color:var(--dim);font-size:13px}
.row>output{flex:0 0 44px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
input[type=range]{flex:1;min-width:0;height:32px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips+.cap{margin-top:10px}
.chip{border:1px solid var(--line);background:#0f180f;color:var(--fg);border-radius:18px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.cap{color:var(--dim);font-size:13px;margin:0 0 6px}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:10px;padding:13px 8px;font:inherit;font-weight:700;cursor:pointer;background:#2b3a2a;color:var(--fg)}
.btn.main{flex:2;background:var(--acc);color:#1a1405}
.btn.on{outline:2px solid var(--acc)}
#note{color:var(--dim);font-size:12px;margin-top:8px;min-height:18px;word-break:break-all}
</style>
</head>
<body>
<main>
<nav class="nav"><a href="lab.html">첫 차례 주사위</a><a href="lab-icon.html">아이콘 찍기</a><a href="lab-hand.html">알까기 손</a><a href="lab-poker.html">포커 카메라</a><a href="lab-doll.html">플레이어 인형</a><a href="lab-fan.html" class="on">카드 든 인형</a></nav>
<h1>테스트룸 · 카드 든 인형 <span style="font-weight:400">(메인에 연결되지 않은 연습용 화면입니다)</span></h1>
<div class="wrap">
  <div id="viewBox"><div id="view"><iframe id="game" title="구라! 미리보기"></iframe></div></div>
  <div id="side">
    <section>
      <p class="cap">화면 크기</p>
      <div class="chips" id="sizes"></div>
      <p class="cap">인원 (나 + 봇)</p>
      <div class="chips" id="ns"></div>
      <p class="cap">봇 자리 모습</p>
      <div class="chips" id="who"></div>
    </section>
    <section>
      <p class="cap">상대 손패</p>
      <div class="chips" id="mode"></div>
      <p class="cap">손</p>
      <div class="chips" id="hand"></div>
    </section>
    <section id="sliders"></section>
    <div class="btns">
      <button class="btn" id="pause">⏸ 멈춤</button>
      <button class="btn main" id="restart">↻ 다시 시작</button>
      <button class="btn" id="copy">값 복사</button>
    </div>
    <div class="btns" style="margin-top:8px"><button class="btn" id="reset">기본값으로</button></div>
    <div id="note"></div>
  </div>
</div>
</main>
<script>
const KEY='gura-lab-fan';
const SIZES=[['휴대폰 세로',390,844],['휴대폰 가로',844,390],['PC',1440,900]];
const WHO=['인형','통나무','섞어서'];
/* 봇 자리에 앉힐 인형 (종류-동물-바탕색-장식): 나무 말 노랑, 토끼 파랑 밀짚모자, 오뚝이 빨강, 여우 주황 안경, 곰 갈색 목도리, 개구리 초록 고깔, 고양이 분홍 */
const AVS=['0-0-2-0','1-0-5-1','2-0-0-0','1-3-1-4','1-1-8-3','1-8-3-2','1-2-7-0'];
const SL=[   // [키, 이름, 최소, 최대, 간격, 단위]
  ['s','카드 크기',.3,.9,.01,''],
  ['y','높이',-.1,.6,.01,''],
  ['r','앞뒤',4.6,5.6,.01,''],
  ['tilt','기울기',-20,60,1,'°'],
  ['step','펼침',2,16,.5,'°'],
  ['max','펼침 상한',30,180,5,'°'],
  ['n','최대 장수',3,20,1,'장'],
  ['L','손 위치',.15,.5,.01,'']
];
const DEF={size:0,n4:4,who:0,fan:1,hand:1,s:.55,y:.06,r:5.02,tilt:22,step:8,max:110,n:13,L:.36};
let S={...DEF},paused=false;
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
for(const k in DEF)if(S[k]==null)S[k]=DEF[k];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),fr=$('#game');

function chips(box,list,get,set){
  box.innerHTML='';
  list.forEach((t,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{set(i);draw()};box.appendChild(b)});
  const draw=()=>[...box.children].forEach((b,i)=>b.classList.toggle('on',i===get()));
  draw();return draw;
}
chips($('#sizes'),SIZES.map(s=>s[0]),()=>S.size,i=>{S.size=i;save();fit()});
chips($('#ns'),[2,3,4,5,6].map(n=>n+'명'),()=>S.n4-2,i=>{S.n4=i+2;save();start()});
chips($('#who'),WHO,()=>S.who,i=>{S.who=i;save();apply()});
const drawMode=chips($('#mode'),['지금 (탁자 위 더미)','부채꼴'],()=>S.fan,i=>{S.fan=i;save();apply()});
const drawHand=chips($('#hand'),['없음','공','장갑'],()=>S.hand,i=>{S.hand=i;save();apply()});

/* 슬라이더 */
const fmt=(k,v)=>{const d=SL.find(x=>x[0]===k);return (+v).toFixed(d[4]<.1?2:d[4]<1?1:0)+d[5]};
$('#sliders').innerHTML=SL.map(([k,n,a,b,st])=>`<div class="row"><label for="sl-${k}">${n}</label><input type="range" id="sl-${k}" min="${a}" max="${b}" step="${st}"><output id="o-${k}"></output></div>`).join('');
function syncSliders(){for(const [k] of SL){$('#sl-'+k).value=S[k];$('#o-'+k).textContent=fmt(k,S[k])}}
for(const [k] of SL){const r=$('#sl-'+k);r.oninput=()=>{S[k]=+r.value;$('#o-'+k).textContent=fmt(k,S[k]);save();apply()}}
syncSliders();

/* 미리보기 크기: 고른 화면 크기를 남은 자리에 맞춰 줄임 */
function fit(){
  const [,w,h]=SIZES[S.size]||SIZES[0],box=$('#viewBox');
  const aw=box.clientWidth||w,ah=Math.max(320,innerHeight-(innerWidth<760?300:40)),k=Math.min(1,aw/w,ah/h);
  fr.style.width=w+'px';fr.style.height=h+'px';fr.style.transform=`scale(${k})`;
  $('#view').style.width=Math.round(w*k)+'px';$('#view').style.height=Math.round(h*k)+'px';
}
addEventListener('resize',fit);

/* 게임 안 값 바꾸기: 부채꼴 값(OPP_FAN)과 봇 자리 모습 */
function apply(){
  const w=fr.contentWindow;let F=null;try{F=w&&w.eval('typeof OPP_FAN!=="undefined"?OPP_FAN:null')}catch(e){}if(!F)return;
  Object.assign(F,{on:S.fan,hand:S.hand,s:S.s,y:S.y,r:S.r,tilt:S.tilt,step:S.step,max:S.max,n:S.n,L:S.L});
  w.LABF={who:S.who,av:AVS};
  try{w.eval('if(H&&mode==="host")mark()');w.fanPose()}catch(e){}
}
/* 게임 안에서: 혼자(오프라인) 구라! 탁자를 차리고 봇을 앉혀 바로 시작 */
function start(){
  $('#note').textContent='불러오는 중입니다…';paused=false;$('#pause').classList.remove('on');$('#pause').textContent='⏸ 멈춤';
  fr.onload=()=>{
    const w=fr.contentWindow;let tries=0;
    const go=()=>{
      let ok=false;try{ok=!!(w.GAMES&&w.GAMES.gura&&w.eval('typeof OPP_FAN!=="undefined"')&&w.eval('typeof hostNew==="function"&&typeof snapFor==="function"&&typeof T!=="undefined"&&T.ok!==undefined'))}catch(e){}
      if(!ok){if(tries++<100)return setTimeout(go,100);$('#note').textContent='게임을 불러오지 못했습니다.';return}
      let prev=null;try{prev=localStorage.getItem('gura-game')}catch(e){}
      apply();
      // 봇 자리를 인형으로 보이게: 화면에 가는 상태(snapFor)에서만 봇 표시를 떼고 인형 값을 붙임(엔진의 봇은 그대로 둠)
      w.eval(`(function(){const sf=snapFor;snapFor=function(you){const s=sf(you);const L=window.LABF;if(L&&s&&s.ps&&L.who!==1)s.ps.forEach((p,i)=>{if(p.b&&(L.who===0||i%2===1)){p.b=0;p.av=L.av[i%L.av.length]}});return s};
        const E=GAMES.gura.engine,tk=E.tick;E.tick=function(){if(!window.LAB_PAUSE)return tk.apply(E,arguments)}})()`);
      w.LAB_PAUSE=false;
      w.eval(`cfg.gi=GAME_IDS.indexOf('gura');mode='host';hostNew(false,'0000','테스트룸');H.cfg.max=6;enterRoom();for(let k=1;k<${S.n4};k++)hostAddBot(true);mark();hostStart();`);
      try{if(prev==null)localStorage.removeItem('gura-game');else localStorage.setItem('gura-game',prev)}catch(e){}   // 실제 게임의 마지막 고른 게임은 그대로
      $('#note').textContent='';
    };
    go();
  };
  fr.src='index.html?lab='+Date.now();
}
$('#pause').onclick=()=>{paused=!paused;const w=fr.contentWindow;if(w)w.LAB_PAUSE=paused;$('#pause').classList.toggle('on',paused);$('#pause').textContent=paused?'▶ 계속':'⏸ 멈춤'};
$('#restart').onclick=start;
$('#reset').onclick=()=>{const keep={size:S.size,n4:S.n4,who:S.who};S={...DEF,...keep};save();syncSliders();drawHand();drawMode();apply()};
$('#copy').onclick=()=>{const t=`부채꼴: 손 ${['없음','공','장갑'][S.hand]}, `+SL.map(([k,n])=>`${n} ${fmt(k,S[k])}`).join(', ');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$('#note').textContent='복사했습니다: '+t},()=>{$('#note').textContent=t})};
fit();start();
</script>
</body>
</html>
