<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>테스트룸 · 플레이어 인형</title>
<style>
:root{--bg:#10170f;--panel:#1a241a;--line:#2d3b2c;--fg:#e8efe4;--dim:#93a38f;--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
main{max-width:560px;margin:0 auto;padding:10px 12px calc(24px + env(safe-area-inset-bottom))}
.nav{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.nav a{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:13px}
.nav a.on{color:#1a1405;background:var(--acc);border-color:var(--acc);font-weight:700}
#viewWrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 8px}
#view{position:relative;width:100%;aspect-ratio:1/1;max-height:58vh;margin:0 auto;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#bfe3f2;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:8px;bottom:6px;font-size:12px;color:#33412c;background:rgba(255,250,240,.78);border-radius:8px;padding:2px 8px;pointer-events:none}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
h2{font-size:13px;color:var(--dim);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#0f180f;color:var(--fg);border-radius:18px;padding:7px 12px;font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.sw.on{border-color:#fff}
.row{display:flex;align-items:center;gap:10px;margin:8px 0 0}
.row>label{flex:0 0 64px;color:var(--dim);font-size:13px}
input[type=range]{flex:1;min-width:0;height:32px;accent-color:var(--acc)}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;border:0;border-radius:10px;padding:11px 8px;font:inherit;font-weight:700;cursor:pointer;background:#2b3a2a;color:var(--fg)}
#note{margin-top:8px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<main>
<nav class="nav"><a href="lab.html">첫 차례 주사위</a><a href="lab-icon.html">아이콘 찍기</a><a href="lab-hand.html">알까기 손</a><a href="lab-poker.html">포커 카메라</a><a href="lab-doll.html" class="on">플레이어 인형</a></nav>
<div id="viewWrap"><div id="view"><div id="hint">인형을 문지르면 색칠 · 빈 곳을 끌면 돌려 보기 · 두 손가락/휠로 확대</div></div></div>

<section>
<h2>가까이 볼 인형</h2>
<div class="chips" id="focus"></div>
</section>

<section>
<h2>색칠</h2>
<div class="pal" id="pal"></div>
<div class="row"><label>붓 크기</label><input type="range" id="brush" min="2" max="14" value="6"></div>
<div class="btns"><button class="btn" id="paintTog">색칠 끄기</button><button class="btn" id="reset">고른 인형 처음으로</button></div>
<div id="note"></div>
</section>

<section>
<h2>동물 (동물 나무 인형·봇 종이)</h2>
<div class="chips" id="animal"></div>
</section>

<section>
<h2>표정 · 움직임</h2>
<div class="chips" id="expr"></div>
<div class="btns"><button class="btn" id="hop">폴짝</button><button class="btn" id="nod">끄덕</button><button class="btn" id="tilt">갸웃</button></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* 테스트룸 · 플레이어 인형: 의자(나무 기둥) 위에 얹을 인형 후보를 나란히 세워 보고, 손으로 색칠해 봄.
   게임 코드와 따로 도는 시험용 페이지(메인에 링크 없음). 정해지면 core 쪽으로 옮김. */
const $=s=>document.querySelector(s);
const INK=0x3b2a1a,SH=1.35;   // 의자 높이는 core/front.js frontBuildStumps와 같게
const ANIMALS=[['rabbit','토끼'],['bear','곰'],['cat','고양이'],['fox','여우']];
const EXPRS=['웃음','놀람','시무룩'];
const COLORS=['#e4573d','#f2994a','#f2c14e','#6fbf5f','#3fa7a0','#4a7fd4','#8c62c9','#e58fb1','#7b5534','#f6ecd8','#2a2420'];
const S={focus:-1,animal:'rabbit',expr:0,color:COLORS[0],brush:6,paint:true};

const view=$('#view'),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));view.insertBefore(R.domElement,view.firstChild);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbfe3f2);
const cam=new THREE.PerspectiveCamera(32,1,.1,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x8fae7a,.75));
const sun=new THREE.DirectionalLight(0xfff2d8,.85);sun.position.set(3,6,4);scene.add(sun);
const RAMP=(()=>{const d=new Uint8Array([70,78,120,255,70,78,120,255,196,192,210,255,255,255,255,255]);const t=new THREE.DataTexture(d,4,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const toon=o=>new THREE.MeshToonMaterial(Object.assign({gradientMap:RAMP},o));
const hullM=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});
function hull(m,k){const o=new THREE.Mesh(m.geometry,hullM);o.position.copy(m.position);o.rotation.copy(m.rotation);o.scale.copy(m.scale).multiplyScalar(k||1.045);m.parent.add(o);return o}
{const g=new THREE.Mesh(new THREE.CircleGeometry(14,48),toon({color:0x8fcf6a}));g.rotation.x=-Math.PI/2;scene.add(g)}

/* ---- 색칠 층: 칠한 그림(paint) 위에 얼굴(face)을 덧그려 한 장으로 ---- */
const PAINTS=[];
function mkPaint(w,h,init,face,circ){
  const paint=document.createElement('canvas');paint.width=w;paint.height=h;
  const out=document.createElement('canvas');out.width=w;out.height=h;
  const tex=new THREE.CanvasTexture(out);tex.anisotropy=4;
  const P={w,h,paint,out,tex,init,face,pxU:w/circ,   // pxU: 겉면 길이 1이 가로 몇 픽셀인지 (붓을 동그랗게)
    reset(){const g=paint.getContext('2d');g.clearRect(0,0,w,h);init(g,w,h);P.redraw()},
    redraw(){const g=out.getContext('2d');g.clearRect(0,0,w,h);g.drawImage(paint,0,0);if(P.face)P.face(g,w,h);tex.needsUpdate=true}};
  P.reset();PAINTS.push(P);return P;
}
const fill=c=>(g,w,h)=>{g.fillStyle=c;g.fillRect(0,0,w,h)};
/* 얼굴: 눈 둘 + 입. s = 얼굴 크기(픽셀), 표정은 S.expr */
function drawFace(g,cx,cy,s,ink){
  g.save();g.fillStyle=g.strokeStyle=ink||'#2a2420';g.lineCap='round';g.lineWidth=Math.max(2,s*.09);
  const ex=s*.42,ey=-s*.12,er=s*(S.expr===1?.13:.1);
  for(const k of[-1,1]){g.beginPath();if(S.expr===2){g.moveTo(cx+k*ex-er,cy+ey-er*.6*k);g.lineTo(cx+k*ex+er,cy+ey+er*.6*k);g.stroke()}else{g.arc(cx+k*ex,cy+ey,er,0,7);g.fill()}}
  g.beginPath();
  if(S.expr===0)g.arc(cx,cy+s*.12,s*.26,.15*Math.PI,.85*Math.PI);
  else if(S.expr===1)g.arc(cx,cy+s*.34,s*.1,0,7);
  else g.arc(cx,cy+s*.56,s*.24,1.2*Math.PI,1.8*Math.PI);
  g.stroke();g.restore();
}

/* ---- 인형 부품 ---- */
function part(geo,P,parent,o){   // 색칠되는 부품 하나
  const m=new THREE.Mesh(geo,toon({map:P.tex,side:o&&o.side||THREE.FrontSide}));m.userData.P=P;parent.add(m);
  if(o&&o.pos)m.position.set(...o.pos);if(o&&o.rotY!=null)m.rotation.y=o.rotY;if(o&&o.scale)m.scale.set(...o.scale);
  if(!(o&&o.noHull))hull(m,o&&o.hull);return m;
}
const lathe=pts=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),28);
const latheLen=pts=>pts.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);
function lathePaint(pts,init,face){const r=Math.max(...pts.map(p=>p[0]))*.8,circ=2*Math.PI*r,w=256,h=Math.round(w*latheLen(pts)/circ/8)*8;return mkPaint(w,h,init,face,circ)}
const spherePaint=(r,init,face)=>mkPaint(256,128,init,face,2*Math.PI*r);
/* 회전체·구 모두 그림 가운데(u=0.5)가 앞(+z)을 보게 돌려 둠: 얼굴이 이음매에 걸리지 않게 */
const LROT=Math.PI,SROT=-Math.PI/2;

const DOLLS=[];
function doll(name,build){
  const g=new THREE.Group(),body=new THREE.Group();g.add(body);
  const st=new THREE.Mesh(new THREE.CylinderGeometry(.55,.66,SH,14),toon({color:0x7b5534}));st.position.y=SH/2;g.add(st);hull(st,1.04);
  const top=new THREE.Mesh(new THREE.CircleGeometry(.55,14),toon({color:0xd9b07a}));top.rotation.x=-Math.PI/2;top.position.y=SH+.002;g.add(top);
  body.position.y=SH;const D={name,g,body,h:1.1,build,paints:[],anim:null};
  D.rebuild=()=>{while(body.children.length)body.remove(body.children[0]);const n0=PAINTS.length;build(body,D);D.paints=PAINTS.slice(n0)};
  D.rebuild();scene.add(g);DOLLS.push(D);return D;
}

/* 1. 나무 말 */
doll('나무 말',b=>{
  const pts=[[0,0],[.34,0],[.37,.05],[.36,.1],[.2,.6],[.17,.7]];
  part(lathe(pts),lathePaint(pts,fill('#e4573d')),b,{rotY:LROT});
  part(new THREE.SphereGeometry(.26,24,16),spherePaint(.26,fill('#e4573d')),b,{pos:[0,.9,0],rotY:SROT});
});
/* 2. 동물 나무 인형: 몸통은 같고 귀·꼬리만 다름 */
const ANI_C={rabbit:'#f6ecd8',bear:'#b9824f',cat:'#f2c14e',fox:'#f2994a'};
doll('동물 나무 인형',b=>{
  const c=ANI_C[S.animal],pts=[[0,0],[.32,0],[.39,.08],[.38,.3],[.3,.52],[.19,.66]];
  part(lathe(pts),lathePaint(pts,(g,w,h)=>{fill(c)(g,w,h);g.fillStyle='#fff8ea';g.beginPath();g.ellipse(w/2,h*.52,w*.11,h*.3,0,0,7);g.fill()}),b,{rotY:LROT});
  const hr=.32,hy=.9;
  part(new THREE.SphereGeometry(hr,24,16),spherePaint(hr,fill(c),(g,w,h)=>drawFace(g,w/2,h*.47,22)),b,{pos:[0,hy,0],rotY:SROT});
  const sn=new THREE.Mesh(new THREE.SphereGeometry(.1,14,10),toon({color:0xfff8ea}));sn.position.set(0,hy-.07,hr-.04);sn.scale.set(1.2,.8,.7);b.add(sn);
  const no=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),toon({color:0x2a2420}));no.position.set(0,hy-.04,hr+.035);b.add(no);
  const ear=(geo,x,y,o)=>part(geo,mkPaint(64,64,fill(c),null,.6),b,Object.assign({pos:[x,hy+y,0]},o));
  for(const k of[-1,1]){
    if(S.animal==='rabbit'){const e=ear(new THREE.CylinderGeometry(.07,.085,.42,12),k*.13,.46,{});e.rotation.z=-k*.12;ear(new THREE.SphereGeometry(.07,12,8),k*.155,.67,{})}
    else if(S.animal==='bear')ear(new THREE.SphereGeometry(.115,14,10),k*.23,.25,{scale:[1,1,.6]});
    else if(S.animal==='cat'){const e=ear(new THREE.ConeGeometry(.12,.22,4),k*.19,.32,{});e.rotation.z=-k*.25}
    else{const e=ear(new THREE.ConeGeometry(.13,.32,4),k*.18,.37,{});e.rotation.z=-k*.2}
  }
  if(S.animal==='fox'||S.animal==='cat'){const t=part(new THREE.ConeGeometry(.11,.5,10),mkPaint(64,64,(g,w,h)=>{fill(c)(g,w,h);if(S.animal==='fox'){g.fillStyle='#fff8ea';g.fillRect(0,0,w,h*.3)}},null,.6),b,{pos:[.16,.3,-.36]});t.rotation.x=-.9;t.rotation.z=-.3}
});
/* 3. 오뚝이: 회전체 하나에 얼굴·옷을 그림으로 */
doll('오뚝이',b=>{
  const pts=[[0,0],[.22,.01],[.38,.14],[.44,.34],[.4,.54],[.28,.68],[.25,.74],[.3,.84],[.32,.95],[.27,1.06],[.14,1.14],[0,1.16]];
  part(lathe(pts),lathePaint(pts,(g,w,h)=>{fill('#4a7fd4')(g,w,h);g.fillStyle='#ffe2c4';g.fillRect(0,0,w,h*.36);g.fillStyle='#2a2420';g.fillRect(0,0,w,h*.07);g.fillStyle='#f2c14e';g.fillRect(0,h*.36,w,h*.035)},
    (g,w,h)=>drawFace(g,w/2,h*.22,22)),b,{rotY:LROT});
});
/* 4. 종이 스탠디: 그림 한 장을 받침에 세움 */
doll('종이 스탠디',b=>{
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.3,.33,.07,16),toon({color:0xd9b07a}));base.position.y=.035;b.add(base);hull(base,1.05);
  const P=mkPaint(192,288,(g,w,h)=>{g.fillStyle='#fffdf6';g.fillRect(0,0,w,h);g.strokeStyle='#2a2420';g.lineWidth=5;g.lineJoin='round';
    g.beginPath();g.arc(w/2,h*.3,w*.26,0,7);g.stroke();g.beginPath();g.moveTo(w*.3,h*.52);g.lineTo(w*.7,h*.52);g.lineTo(w*.84,h*.94);g.lineTo(w*.16,h*.94);g.closePath();g.stroke();
    g.strokeStyle='rgba(42,36,32,.35)';g.lineWidth=3;g.strokeRect(3,3,w-6,h-6)},(g,w,h)=>drawFace(g,w/2,h*.31,30),1.9);
  part(new THREE.PlaneGeometry(.64,.96),P,b,{pos:[0,.07+.48,0],side:THREE.DoubleSide,noHull:1});
});
/* 5. 물건형: 화분 (사람 모양이 아니라 물건으로 자리를 나타냄) */
doll('물건 · 화분',b=>{
  const pts=[[0,0],[.24,0],[.26,.04],[.34,.44],[.38,.46],[.38,.54],[.33,.55]];
  part(lathe(pts),lathePaint(pts,(g,w,h)=>{fill('#c9744a')(g,w,h);g.fillStyle='#e08a5c';g.fillRect(0,0,w,h*.2)}),b,{rotY:LROT});
  const soil=new THREE.Mesh(new THREE.CircleGeometry(.33,20),toon({color:0x5a3a22}));soil.rotation.x=-Math.PI/2;soil.position.y=.5;b.add(soil);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.03,.36,8),toon({color:0x4f9a45}));stem.position.y=.68;b.add(stem);
  for(const k of[-1,1]){const l=part(new THREE.SphereGeometry(.15,14,10),mkPaint(64,64,fill('#6fbf5f'),null,.9),b,{pos:[k*.15,.9,0],scale:[1,.35,.6]});l.rotation.z=k*.5}
});
/* 6. 봇: 통나무 + 동물 얼굴 종이 + 투명 테이프 */
doll('봇 · 통나무',b=>{
  const log=new THREE.Mesh(new THREE.CylinderGeometry(.3,.32,.8,14),toon({color:0x7b5534}));log.position.y=.4;b.add(log);hull(log,1.05);
  const top=new THREE.Mesh(new THREE.CircleGeometry(.3,14),toon({color:0xd9b07a}));top.rotation.x=-Math.PI/2;top.position.y=.802;b.add(top);
  const c=ANI_C[S.animal],a=S.animal;
  const P=mkPaint(160,176,(g,w,h)=>{g.fillStyle='#fffdf6';g.fillRect(0,0,w,h);g.fillStyle=c;g.strokeStyle='#2a2420';g.lineWidth=5;g.lineJoin='round';
    const cx=w/2,cy=h*.6,r=w*.3;
    for(const k of[-1,1]){g.beginPath();
      if(a==='rabbit')g.ellipse(cx+k*r*.45,cy-r*1.45,r*.22,r*.7,k*.12,0,7);
      else if(a==='bear')g.arc(cx+k*r*.75,cy-r*.75,r*.33,0,7);
      else{g.moveTo(cx+k*r*.25,cy-r*.85);g.lineTo(cx+k*r*.85,cy-r*(a==='fox'?1.6:1.35));g.lineTo(cx+k*r*.98,cy-r*.3);g.closePath()}
      g.fill();g.stroke()}
    g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.stroke()},(g,w,h)=>drawFace(g,w/2,h*.6,28),1.2);
  const pp=part(new THREE.PlaneGeometry(.4,.44),P,b,{pos:[0,.42,.325],noHull:1});pp.rotation.z=.06;
  const tape=new THREE.Mesh(new THREE.PlaneGeometry(.2,.075),new THREE.MeshBasicMaterial({color:0xfff3c4,transparent:true,opacity:.55}));tape.position.set(.01,.635,.328);tape.rotation.z=-.1;b.add(tape);
});
DOLLS.forEach((D,i)=>{D.g.position.x=(i-(DOLLS.length-1)/2)*1.55});

/* ---- 카메라: 빈 곳을 끌면 돌려 보기 ---- */
const C={yaw:0,pit:.2,dist:17,tx:0,toYaw:0,toDist:17,toTx:0};
function focus(i){S.focus=i;C.toTx=i<0?0:DOLLS[i].g.position.x;C.toDist=i<0?17:5.2;[...$('#focus').children].forEach((b,k)=>b.classList.toggle('on',k-1===i))}
function camPut(){C.tx+=(C.toTx-C.tx)*.15;C.dist+=(C.toDist-C.dist)*.15;const ty=SH+.45;
  cam.position.set(C.tx+Math.sin(C.yaw)*Math.cos(C.pit)*C.dist,ty+Math.sin(C.pit)*C.dist,Math.cos(C.yaw)*Math.cos(C.pit)*C.dist);cam.lookAt(C.tx,ty,0)}
function resize(){const w=view.clientWidth,h=view.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---- 색칠: 누른 자리의 겉면 좌표(uv)에 붓 자국 ---- */
const ray=new THREE.Raycaster(),ptrs=new Map();let stroke=null,pinch=0;
function paintables(){const a=[];DOLLS.forEach(D=>D.body.traverse(o=>{if(o.userData.P)a.push(o)}));return a}
function hitAt(e){const r=R.domElement.getBoundingClientRect();ray.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);const h=ray.intersectObjects(paintables(),false)[0];return h&&h.uv?h:null}
function dab(P,u,v){const g=P.paint.getContext('2d'),rad=S.brush*.012*P.pxU;g.fillStyle=S.color;
  for(const du of[-1,0,1]){g.beginPath();g.arc((u+du)*P.w,(1-v)*P.h,rad,0,7);g.fill()}}   // 이음매를 넘어가도 이어지게 양옆에도 찍음
function paintTo(h){const P=h.object.userData.P,u=h.uv.x,v=h.uv.y;
  if(stroke&&stroke.P===P&&Math.abs(u-stroke.u)<.3){const n=Math.ceil(Math.hypot((u-stroke.u)*P.w,(v-stroke.v)*P.h)/2);for(let k=1;k<=n;k++)dab(P,stroke.u+(u-stroke.u)*k/n,stroke.v+(v-stroke.v)*k/n)}else dab(P,u,v);
  stroke={P,u,v};P.redraw()}
const el=R.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){stroke=null;const[a,b]=[...ptrs.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);return}
  const h=S.paint&&hitAt(e);if(h){stroke=null;paintTo(h);const i=DOLLS.findIndex(D=>D.paints.includes(h.object.userData.P));if(i>=0)S.last=i}else stroke=null;
  el.dataset.mode=h?'paint':'orbit'});
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)C.toDist=Math.min(22,Math.max(3,C.toDist*pinch/d));pinch=d;return}
  if(el.dataset.mode==='paint'){const h=hitAt(e);if(h)paintTo(h);else stroke=null}
  else{C.yaw-=dx*.008;C.pit=Math.min(1.2,Math.max(-.05,C.pit+dy*.006))}});
const up=e=>{ptrs.delete(e.pointerId);pinch=0;if(el.dataset.mode==='paint'&&!ptrs.size){stroke=null;sizeNote()}};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();C.toDist=Math.min(22,Math.max(3,C.toDist*(e.deltaY>0?1.1:.9)))},{passive:false});
/* 칠한 그림을 다른 사람에게 보낼 때 크기(참고): 고른 인형의 그림을 PNG로 만들었을 때 */
function sizeNote(){const D=DOLLS[S.last??0];if(!D)return;let n=0;D.paints.forEach(P=>{n+=Math.round(P.paint.toDataURL('image/png').length*.75)});$('#note').textContent=`${D.name}: 그림 ${D.paints.length}장, 보낼 때 약 ${(n/1024).toFixed(1)}KB`}

/* ---- 조작 판 ---- */
const chips=(id,list,on,fn)=>{const box=$(id);list.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='chip'+(i===on?' on':'');b.textContent=t;b.onclick=()=>{[...box.children].forEach(x=>x.classList.toggle('on',x===b));fn(i)};box.appendChild(b)})};
chips('#focus',['전체',...DOLLS.map(D=>D.name)],0,i=>focus(i-1));
chips('#animal',ANIMALS.map(a=>a[1]),0,i=>{S.animal=ANIMALS[i][0];DOLLS.filter(D=>/동물|봇/.test(D.name)).forEach(D=>{PAINTS.splice(0,PAINTS.length,...PAINTS.filter(P=>!D.paints.includes(P)));D.rebuild()})});
chips('#expr',EXPRS,0,i=>{S.expr=i;PAINTS.forEach(P=>P.face&&P.redraw())});
COLORS.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='sw'+(i?'':' on');b.style.background=c;b.setAttribute('aria-label','색 '+c);b.onclick=()=>{S.color=c;[...$('#pal').children].forEach(x=>x.classList.toggle('on',x===b))};$('#pal').appendChild(b)});
$('#brush').oninput=e=>{S.brush=+e.target.value};
$('#paintTog').onclick=()=>{S.paint=!S.paint;$('#paintTog').textContent=S.paint?'색칠 끄기':'색칠 켜기'};
$('#reset').onclick=()=>{const D=DOLLS[S.focus>=0?S.focus:(S.last??0)];D.paints.forEach(P=>P.reset());sizeNote()};
const act=k=>()=>{const now=performance.now();(S.focus>=0?[DOLLS[S.focus]]:DOLLS).forEach((D,i)=>{D.anim={k,t0:now+i*70}})};
$('#hop').onclick=act('hop');$('#nod').onclick=act('nod');$('#tilt').onclick=act('tilt');

/* ---- 움직임: 시작 시각과의 차이로 계산 ---- */
function animate(now){
  DOLLS.forEach(D=>{const b=D.body;b.position.y=SH;b.scale.set(1,1,1);b.rotation.set(0,0,0);const A=D.anim;if(!A)return;const t=(now-A.t0)/1000;if(t<0)return;
    if(A.k==='hop'){const d=.55;if(t>d){D.anim=null;return}const p=t/d,y=Math.sin(p*Math.PI)*.45,sq=p<.12?1-p/.12*.18:p>.88?1-(1-p)/.12*.18:1+Math.sin(p*Math.PI)*.06;b.position.y=SH+y;b.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq))}
    else if(A.k==='nod'){const d=.7;if(t>d){D.anim=null;return}b.rotation.x=Math.sin(t/d*Math.PI*2)*.22*(1-t/d)}
    else{const d=.8;if(t>d){D.anim=null;return}b.rotation.z=Math.sin(Math.min(1,t/.25)*Math.PI/2)*.28*(t>.55?(d-t)/.25:1)}});
  camPut();R.render(scene,cam);requestAnimationFrame(animate);
}
focus(-1);C.tx=C.toTx;C.dist=C.toDist;requestAnimationFrame(animate);
</script>
</body>
</html>
