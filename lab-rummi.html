<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>테스트룸 · 루미큐브 탑뷰</title>
<style>
:root{--bg:#10170f;--panel:#1a241a;--line:#2d3b2c;--fg:#e8efe4;--dim:#93a38f;--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,'Noto Sans KR',sans-serif}
body{display:flex;flex-direction:column}
#ui{padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#ui.fold .rows{display:none}
.nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav a,.nav button{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:18px;padding:4px 11px;font:inherit;font-size:13px;background:none;cursor:pointer}
.nav a.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
.row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.row>label{flex:0 0 66px;color:var(--dim);font-size:13px}
.chip{border:1px solid var(--line);background:#0f180f;color:var(--fg);border-radius:16px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}
#note{color:var(--dim);font-size:12px;margin-top:6px}
#wrap{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start}
#wrap.fit{align-items:stretch}
#stage{position:relative;overflow:hidden;background:#000;flex:0 0 auto}
#wrap.fit #stage{flex:1 1 auto;width:100%!important;height:auto!important}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
/* 이름 칸 자리(가짜): 실제 게임에서는 공통 이름 칸이 들어감 */
.bar{position:absolute;left:0;right:0;display:flex;gap:6px;justify-content:center;align-items:center;pointer-events:none;font-size:13px}
.bar.top{top:8px}.bar.bot{bottom:8px;justify-content:space-between;padding:0 10px}
.pl{background:rgba(20,26,20,.72);color:#f1ead8;border-radius:14px;padding:5px 10px;white-space:nowrap}
.pl.on{outline:2px solid #f2c14e}
.pl b{font-weight:700}.pl i{font-style:normal;opacity:.75;margin-left:6px}
.endbtn{background:#f2c14e;color:#1a1405;border-radius:14px;padding:8px 14px;font-weight:700}
</style>
</head>
<body>
<div id="ui">
  <nav class="nav"><a href="lab.html">첫 차례 주사위</a><a href="lab-icon.html">아이콘 찍기</a><a href="lab-hand.html">알까기 손</a><a href="lab-poker.html">포커 카메라</a><a href="lab-rummi.html" class="on">루미큐브 탑뷰</a><button id="fold">접기</button></nav>
  <div class="rows">
    <div class="row"><label>탁자 타일</label><span data-k="n" data-v="0,20,50,80,100"></span></div>
    <div class="row"><label>내 패</label><span data-k="rack" data-v="14,20,26,34"></span></div>
    <div class="row"><label>타일 모양</label><span data-k="style" data-v="0,1" data-n="밝은 타일,색 타일"></span></div>
    <div class="row"><label>카메라</label><span data-k="cam" data-v="90,82,75" data-n="바로 위,82°,75°"></span></div>
    <div class="row"><label>받침대 기울기</label><span data-k="tilt" data-v="0,20,40" data-n="눕힘,20°,40°"></span></div>
    <div class="row"><label>표시</label><span data-k="mark" data-v="0,1" data-n="없음,이번 차례에 낸 타일 + 틀린 묶음"></span></div>
    <div class="row"><label>인원</label><span data-k="pl" data-v="2,3,4"></span></div>
    <div class="row"><label>화면</label><span data-k="size" data-v="fit,390x780,360x640,820x1180,780x390,1280x800" data-n="창 크기,휴대폰,작은 휴대폰,태블릿,휴대폰 가로,PC"></span></div>
    <div id="note"></div>
  </div>
</div>
<div id="wrap"><div id="stage"><canvas id="cv"></canvas>
  <div class="bar top" id="barTop"></div>
  <div class="bar bot"><span class="pl on"><b>나</b><i id="meN"></i></span><span class="pl">남은 패 <b id="poolN"></b></span><span class="endbtn">차례 마치기</span></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="games/rummi.js"></script>
<script>
/* 루미큐브 탑뷰 미리보기: 실제 게임이 쓸 타일 그림·칸 자리(games/rummi.js의 G.kit)로 정해진 장면을 그림. 조작은 없음 */
const RM=GAMES.rummi,K=RM.kit,J=RM.judge,TT=RM._test,L=K.LAY;
const Q=new URLSearchParams(location.search);
const S={n:80,rack:14,style:0,cam:90,tilt:20,mark:0,pl:4,size:'fit'};
for(const k in S)if(Q.has(k))S[k]=k==='size'?Q.get(k):+Q.get(k);
if(Q.get('ui')==='0')document.getElementById('ui').style.display='none';
const $=s=>document.querySelector(s);
/* 고르는 칸 */
document.querySelectorAll('[data-k]').forEach(el=>{
  const k=el.dataset.k,vs=el.dataset.v.split(','),ns=(el.dataset.n||el.dataset.v).split(',');
  vs.forEach((v,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=ns[i];b.dataset.v=v;
    b.onclick=()=>{S[k]=k==='size'?v:+v;sync();build()};el.appendChild(b);el.appendChild(document.createTextNode(' '))});
});
function sync(){
  document.querySelectorAll('[data-k]').forEach(el=>el.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',String(S[el.dataset.k])===b.dataset.v)));
  const u=new URLSearchParams(S);history.replaceState(null,'','?'+u);
}
$('#fold').onclick=()=>{$('#ui').classList.toggle('fold');$('#fold').textContent=$('#ui').classList.contains('fold')?'펴기':'접기';layout()};

/* 정해진 무작위 */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* 장면: 탁자에 n개쯤(묶음 단위), 내 패 k개 */
function scene(n,k){
  const R=rng(7),left=new Set([...Array(TT.NT).keys()]),g=new Array(TT.CELLS).fill(-1),sets=[];
  const take=(c,v)=>{for(const cp of [0,1]){const id=cp*52+c*13+v-1;if(left.has(id))return id}return -1};
  let placed=0,tries=0;
  while(placed<n&&tries++<4000){
    const room=n-placed;if(room<3)break;
    let ids;
    if(R()<.55){const c=R()*4|0,len=Math.min(room,3+(R()*R()*5|0)),st=1+(R()*(14-len)|0);ids=[];for(let v=st;v<st+len;v++)ids.push(take(c,v))}
    else{const v=1+(R()*13|0),m=Math.min(room,R()<.4?4:3),cs=[0,1,2,3].sort(()=>R()-.5).slice(0,m).sort();ids=cs.map(c=>take(c,v))}
    if(ids.includes(-1)||new Set(ids).size!==ids.length)continue;
    if(sets.length===2&&left.has(TT.JK))ids[1]=TT.JK;   // 조커 하나
    const at=TT.findSpot(g,ids.length);if(at<0)continue;
    ids.forEach((x,j)=>{g[at+j]=x;left.delete(x)});sets.push({at,ids});placed+=ids.length;
  }
  const rest=[...left].sort(()=>R()-.5),rack=rest.slice(0,k).sort((a,b)=>J.isJ(a)-J.isJ(b)||J.colOf(a)-J.colOf(b)||J.numOf(a)-J.numOf(b));
  let put=[],bad=null;
  if(S.mark&&sets.length>2){
    put=sets[sets.length-1].ids.slice();                                  // 마지막 묶음은 이번 차례에 냄
    const s=sets[sets.length-2],x=rest[k];                                // 그 앞 묶음 끝에 안 맞는 타일을 붙여 틀린 묶음으로
    if(x!=null&&s.at%TT.W+s.ids.length<TT.W&&g[s.at+s.ids.length]<0&&!J.setValue([...s.ids,x])){g[s.at+s.ids.length]=x;put.push(x);bad={at:s.at,len:s.ids.length+1}}
  }
  return {g,rack,put,bad,onTable:g.filter(x=>x>=0).length,left:TT.NT-g.filter(x=>x>=0).length-k};
}

/* 3D */
const cv=$('#cv'),stage=$('#stage');
const rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});rd.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x8a5530);
sc.add(new THREE.HemisphereLight(0xfff1e0,0xb48a5c,.78));
const dl=new THREE.DirectionalLight(0xffe9c8,.5);dl.position.set(-5,10,4);sc.add(dl);
const cam=new THREE.PerspectiveCamera(30,1,.1,400);
const root=new THREE.Group();sc.add(root);
const texCache=new Map();
function faceTex(id,style){
  const key=(id>=TT.JK?id:id%52)+'/'+style;let t=texCache.get(key);if(t)return t;
  const c=document.createElement('canvas');c.width=192;c.height=272;K.drawFace(c.getContext('2d'),192,272,id,style);
  t=new THREE.CanvasTexture(c);t.anisotropy=rd.capabilities.getMaxAnisotropy();texCache.set(key,t);return t;
}
const geo=new THREE.BoxGeometry(L.TW,L.TT,L.TH),flat=new THREE.PlaneGeometry(1,1);flat.rotateX(-Math.PI/2);
const sideM=[new THREE.MeshLambertMaterial({color:0xe9dfc6}),new THREE.MeshLambertMaterial({color:0x8d1f18}),new THREE.MeshLambertMaterial({color:0x1b1b1e})];
const shadowM=new THREE.MeshBasicMaterial({color:0x10200f,transparent:true,opacity:.3,depthWrite:false});
const glowM=new THREE.MeshBasicMaterial({color:0xffd84a,transparent:true,opacity:.95,depthWrite:false});
const badM=new THREE.MeshBasicMaterial({color:0xe5352b,transparent:true,opacity:.95,depthWrite:false});
function tile(id,style,back){
  const side=style&&!back?new THREE.MeshLambertMaterial({color:new THREE.Color(K.INK[J.isJ(id)?(id===TT.JK?1:0):J.colOf(id)]).multiplyScalar(.7)}):sideM[0];
  const top=back?new THREE.MeshLambertMaterial({color:0xefe5cc}):new THREE.MeshLambertMaterial({map:faceTex(id,style),transparent:true});
  const m=new THREE.Mesh(geo,[side,side,top,side,side,side]);
  if(!back){const body=new THREE.Mesh(new THREE.BoxGeometry(L.TW*.985,L.TT*.96,L.TH*.985),side);m.add(body)}   // 둥근 모서리 밖으로 비치는 몸통
  return m;
}
function plane(mat,w,d,x,y,z){const m=new THREE.Mesh(flat,mat);m.scale.set(w,1,d);m.position.set(x,y,z);return m}
function build(){
  while(root.children.length)root.remove(root.children[0]);
  const D=scene(S.n,S.rack),B=K.BOARD,Rg=K.REGION;
  /* 펠트 + 칸 자리 표시 */
  root.add(plane(new THREE.MeshLambertMaterial({color:0x2f6b4a}),B.w+3.2,Rg.z1-Rg.z0+7,0,-.01,(Rg.z0+Rg.z1)/2));
  {const c=document.createElement('canvas'),u=48;c.width=TT.W*u;c.height=TT.RH*Math.round(u*L.CH/L.CW);const g=c.getContext('2d'),ch=c.height/TT.RH;
   g.strokeStyle='rgba(255,255,255,.13)';g.lineWidth=2;
   for(let r=0;r<TT.RH;r++)for(let q=0;q<TT.W;q++){const x=q*u+u*.06,y=r*ch+ch*.045,w=u*.88,h=ch*.91,rr=6;g.beginPath();g.moveTo(x+rr,y);g.arcTo(x+w,y,x+w,y+h,rr);g.arcTo(x+w,y+h,x,y+h,rr);g.arcTo(x,y+h,x,y,rr);g.arcTo(x,y,x+w,y,rr);g.closePath();g.stroke()}
   const t=new THREE.CanvasTexture(c);t.anisotropy=rd.capabilities.getMaxAnisotropy();
   root.add(plane(new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false}),B.w,B.d,0,0,0))}
  /* 탁자 타일 */
  D.g.forEach((id,cell)=>{if(id<0)return;const p=K.cellXZ(cell),m=tile(id,S.style);m.position.set(p.x,L.TT/2,p.z);root.add(m);
    root.add(plane(shadowM,L.TW*1.03,L.TH*1.03,p.x+.07,.004,p.z+.1));
    if(D.put.includes(id))root.add(plane(glowM,L.TW+.2,L.TH+.2,p.x,.006,p.z))});
  if(D.bad){const a=K.cellXZ(D.bad.at),b=K.cellXZ(D.bad.at+D.bad.len-1);root.add(plane(badM,b.x-a.x+L.TW+.34,L.TH+.34,(a.x+b.x)/2,.005,a.z))}
  /* 내 받침대: 나무 몸통 2단 + 기울인 타일 */
  const tl=S.tilt*Math.PI/180,wood=new THREE.MeshLambertMaterial({color:0x9a6a3c}),wood2=new THREE.MeshLambertMaterial({color:0x7c5230});
  const rz=B.d/2+L.GAP;
  {const base=new THREE.Mesh(new THREE.BoxGeometry(B.w+.5,.16,L.CH*2+.16),wood);base.position.set(0,.08,rz+L.CH);root.add(base);
   for(const t of [0,1]){const lip=new THREE.Mesh(new THREE.BoxGeometry(B.w+.5,.3,.1),wood2);lip.position.set(0,.15,rz+L.CH*(t+1)+.03);root.add(lip)}}
  D.rack.forEach((id,i)=>{const p=K.rackXZ(i,D.rack.length),m=tile(id,S.style);
    m.scale.setScalar(p.s);m.rotation.x=tl;m.position.set(p.x,.16+L.TT*p.s/2+Math.sin(tl)*L.TH*p.s/2,p.z);root.add(m)});
  /* 다른 사람 받침대(뒷면): 2명 = 위, 3명 = 왼쪽·오른쪽, 4명 = 왼쪽·위·오른쪽 */
  const seats=S.pl===2?[2]:S.pl===3?[1,3]:[1,2,3],cz=(Rg.z0+B.d/2)/2+0;
  const oppN=q=>Math.max(1,Math.min(9+q*2,Math.floor(D.left/seats.length)-q));
  seats.forEach(q=>{const grp=new THREE.Group(),n=oppN(q);
    for(let i=0;i<n;i++){const m=tile(0,0,true);m.rotation.x=tl;m.position.set((i-(n-1)/2)*L.CW,.16+L.TT/2+Math.sin(tl)*L.TH/2,0);grp.add(m)}
    const base=new THREE.Mesh(new THREE.BoxGeometry(n*L.CW+.5,.16,L.CH+.16),wood);base.position.y=.08;grp.add(base);
    if(q===2){grp.rotation.y=Math.PI;grp.position.set(0,0,Rg.z0-L.GAP-L.CH/2)}
    else{grp.rotation.y=q===1?-Math.PI/2:Math.PI/2;grp.position.set((q===1?-1:1)*(B.w/2+L.GAP+L.CH/2),0,cz)}
    root.add(grp)});
  /* 가짜 이름 칸 */
  const names=['여우 봇','까치 봇','너구리 봇'];
  $('#barTop').innerHTML=seats.map((q,i)=>`<span class="pl"><b>${names[i]}</b><i>${oppN(q)}</i></span>`).join('');
  $('#meN').textContent=D.rack.length;$('#poolN').textContent=Math.max(0,D.left-seats.reduce((x,q)=>x+oppN(q),0));
  build.D=D;layout();
}
/* 카메라: 칸판 + 내 받침대가 이름 칸 사이에 꽉 차게 (다른 탑뷰 게임의 tvBox와 같은 방식) */
function layout(){
  const wrap=$('#wrap');
  if(S.size==='fit'){wrap.classList.add('fit');stage.style.width='';stage.style.height=''}
  else{wrap.classList.remove('fit');const [w,h]=S.size.split('x');stage.style.width=w+'px';stage.style.height=h+'px'}
  const W=stage.clientWidth,H=stage.clientHeight;if(!W||!H)return;
  rd.setSize(W,H,false);
  const Rg=K.REGION,m=W<700?8:16,top=50,bot=58,fw=W-2*m,fh=H-top-bot,rw=Rg.w+.3,rdp=Rg.z1-Rg.z0+.3;
  const s=Math.min(fw/rw,fh/rdp),f=Math.tan(cam.fov*Math.PI/360),d=(H/2)/(s*f),a=(90-S.cam)*Math.PI/180,zc=(Rg.z0+Rg.z1)/2;
  cam.aspect=W/H;cam.up.set(0,0,-1);cam.position.set(0,d*Math.cos(a),zc+d*Math.sin(a));cam.lookAt(0,0,zc);
  cam.setViewOffset(W,H,0,-((top+fh/2)-H/2),W,H);cam.updateProjectionMatrix();
  rd.render(sc,cam);
  const D=build.D,px=s*L.TW;
  $('#note').textContent=`화면 ${W}×${H} · 탁자 타일 ${D?D.onTable:0}개 · 타일 한 개 폭 약 ${px.toFixed(1)}px · 높이 약 ${(s*L.TH).toFixed(1)}px`;
  window.LAB={W,H,px,onTable:D?D.onTable:0};
}
addEventListener('resize',layout);
sync();
(document.fonts&&document.fonts.load?document.fonts.load('700 40px "IBM Plex Mono"').catch(()=>{}):Promise.resolve()).then(()=>{texCache.clear();build()});
build();
</script>
</body>
</html>
